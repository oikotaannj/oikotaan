backend:
  name: github
  repo: oikotaannj/oikotaan
  branch: main
  base_url: https://sveltia-cms-auth.oikotaanassociationofusa.workers.dev

# Saving creates a private draft and a Netlify deploy preview. Editors publish
# only after checking the real page; no GitHub knowledge is required.
publish_mode: preview
site_url: https://www.oikotaannj.org

media_libraries:
  cloudinary:
    config:
      cloud_name: yxpsjuuc
      api_key: "441399937953154"

collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Homepage
        file: src/content/home.yaml
        preview_path: /
        fields:
          - name: hero
            label: Homepage introduction
            widget: object
            fields:
              - { name: kicker, label: Bengali name, widget: string }
              - { name: heading, label: Headline, widget: text }
              - { name: description, label: Introduction, widget: text }
              - { name: image, label: Main photo, widget: image }
              - { name: imageAlt, label: Describe the photo, widget: string }
          - name: programs
            label: What we do
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: icon, label: Icon, widget: select, options: [flame, book, heart] }
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
          - name: gallery
            label: Community photos
            widget: list
            summary: "{{fields.alt}}"
            fields:
              - { name: image, label: Photo, widget: image }
              - { name: alt, label: Describe the photo, widget: string }
          - name: contact
            label: Contact invitation
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Message, widget: text }

      - name: about
        label: About page
        file: src/content/about.yaml
        preview_path: /about/
        fields:
          - name: mission
            label: Mission
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Mission statement, widget: text }

  - name: events
    label: Events
    label_singular: Event
    folder: src/content/events
    create: true
    duplicate: true
    slug: "{{slug}}"
    preview_path: "/events/{{slug}}/"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    view_filters:
      - { label: Featured, field: featured, pattern: true }
      - { label: Hidden drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Event title, widget: string }
      - { name: titleBengali, label: Bengali title, widget: string, required: false }
      - name: date
        label: Start date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
      - name: endDate
        label: End date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
        required: false
        hint: Leave blank for a one-day event.
      - {
          name: time,
          label: Time,
          widget: string,
          required: false,
          hint: "For example: 9:00 AM to 9:00 PM",
        }
      - { name: venue, label: Venue, widget: string }
      - { name: address, label: Full address, widget: string, required: false }
      - name: summary
        label: Short introduction
        widget: text
        pattern: ["^.{1,200}$", "Keep this under 200 characters"]
      - { name: image, label: Main image, widget: image, required: false }
      - { name: imageAlt, label: Describe the image, widget: string, required: false }
      - { name: ticketUrl, label: Registration or ticket link, widget: string, required: false }
      - name: featured
        label: Feature this event on the homepage
        widget: boolean
        default: false
        hint: Only one upcoming event should be featured at a time.
      - name: draft
        label: Hide this event from the website
        widget: boolean
        default: true
        hint: Keep this on until the event is ready to publish.
      - name: body
        label: Main description
        widget: markdown
        required: false

      # A small page builder. Editors add only what the event needs and drag
      # blocks into the desired order. No separate show/hide switches.
      - name: sections
        label: Page sections
        label_singular: Section
        widget: list
        required: false
        collapsed: true
        minimize_collapsed: true
        types:
          - name: story
            label: Text and image
            widget: object
            summary: "Story — {{fields.heading}}"
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Text, widget: text }
              - { name: image, label: Photo, widget: image, required: false }
              - { name: imageAlt, label: Describe the photo, widget: string, required: false }

          - name: highlights
            label: Highlights
            widget: object
            summary: "Highlights — {{fields.heading}}"
            fields:
              - { name: heading, label: Heading, widget: string, default: "What to expect" }
              - { name: intro, label: Introduction, widget: text, required: false }
              - name: items
                label: Highlights
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: kicker, label: Small label, widget: string, required: false }
                  - { name: title, label: Title, widget: string }
                  - { name: description, label: Description, widget: text, required: false }
                  - { name: image, label: Image, widget: image, required: false }
                  - { name: imageAlt, label: Describe the image, widget: string, required: false }

          - name: schedule
            label: Schedule
            widget: object
            summary: "Schedule — {{fields.heading}}"
            fields:
              - { name: heading, label: Heading, widget: string, default: Schedule }
              - { name: note, label: Introductory note, widget: text, required: false }
              - name: days
                label: Days
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Day label, widget: string }
                  - { name: note, label: Note, widget: string, required: false }
                  - name: items
                    label: Schedule items
                    widget: list
                    summary: "{{fields.time}} — {{fields.title}}"
                    fields:
                      - { name: time, label: Time, widget: string }
                      - { name: title, label: What happens, widget: string }
                      - { name: description, label: Detail, widget: text, required: false }

          - name: programs
            label: Performers and programs
            widget: object
            summary: "Programs — {{fields.heading}}"
            fields:
              - { name: heading, label: Heading, widget: string, default: "Cultural programs" }
              - { name: intro, label: Introduction, widget: text, required: false }
              - name: groups
                label: Groups
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Group label, widget: string, required: false }
                  - { name: note, label: Note, widget: string, required: false }
                  - name: items
                    label: Performances
                    widget: list
                    summary: "{{fields.title}}"
                    fields:
                      - { name: time, label: Time, widget: string, required: false }
                      - { name: title, label: Title, widget: string }
                      - { name: performer, label: Performer, widget: string, required: false }
                      - { name: description, label: Description, widget: text, required: false }
                      - { name: image, label: Image, widget: image, required: false }
                      - {
                          name: imageAlt,
                          label: Describe the image,
                          widget: string,
                          required: false,
                        }

          - name: menu
            label: Food and menu
            widget: object
            summary: "Menu — {{fields.heading}}"
            fields:
              - { name: heading, label: Heading, widget: string, default: Food }
              - { name: note, label: Introduction, widget: text, required: false }
              - name: meals
                label: Meals
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: Meal, widget: string }
                  - { name: time, label: Time, widget: string, required: false }
                  - { name: note, label: Note, widget: string, required: false }
                  - name: items
                    label: Dishes
                    widget: list
                    summary: "{{fields.name}}"
                    fields:
                      - { name: name, label: Dish, widget: string }
                      - { name: note, label: Note, widget: string, required: false }
                      - {
                          name: nonVeg,
                          label: Contains meat or fish,
                          widget: boolean,
                          default: false,
                        }

          - name: registration
            label: Registration and pricing
            widget: object
            summary: "Registration — {{fields.heading}}"
            fields:
              - { name: heading, label: Heading, widget: string, default: Registration }
              - { name: intro, label: Introduction, widget: text, required: false }
              - { name: deadline, label: Deadline message, widget: string, required: false }
              - { name: url, label: Registration link, widget: string, required: false }
              - { name: urlLabel, label: Button text, widget: string, default: Register }
              - name: tiers
                label: Prices
                widget: list
                required: false
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { name: name, label: Name, widget: string }
                  - { name: price, label: Price, widget: string }
                  - { name: unit, label: Unit, widget: string, required: false }
                  - { name: description, label: Description, widget: text, required: false }
                  - { name: includes, label: What it includes, widget: list, required: false }
                  - {
                      name: highlight,
                      label: Highlight this option,
                      widget: boolean,
                      default: false,
                    }
              - { name: note, label: Additional note, widget: text, required: false }

          - name: payment
            label: Payment details
            widget: object
            summary: "Payment — {{fields.heading}}"
            fields:
              - { name: heading, label: Heading, widget: string, default: "How to pay" }
              - { name: intro, label: Introduction, widget: text, required: false }
              - { name: qrImage, label: QR code, widget: image, required: false }
              - { name: qrAlt, label: Describe the QR code, widget: string, required: false }
              - { name: qrCaption, label: QR caption, widget: string, required: false }
              - name: methods
                label: Payment methods
                widget: list
                required: false
                summary: "{{fields.label}}: {{fields.value}}"
                fields:
                  - { name: label, label: Method, widget: string }
                  - { name: value, label: Account or payee, widget: string }
                  - { name: note, label: Note, widget: string, required: false }
              - { name: note, label: Additional note, widget: text, required: false }

          - name: gallery
            label: Photo gallery
            widget: object
            summary: "Gallery — {{fields.heading}}"
            fields:
              - { name: heading, label: Heading, widget: string, default: Gallery }
              - { name: intro, label: Introduction, widget: text, required: false }
              - name: photos
                label: Photos
                widget: list
                fields:
                  - { name: image, label: Photo, widget: image }
                  - { name: alt, label: Describe the photo, widget: string }

          - name: faq
            label: Questions and answers
            widget: object
            summary: "FAQ — {{fields.heading}}"
            fields:
              - { name: heading, label: Heading, widget: string, default: "Good to know" }
              - name: items
                label: Questions
                widget: list
                summary: "{{fields.question}}"
                fields:
                  - { name: question, label: Question, widget: string }
                  - { name: answer, label: Answer, widget: text }

  - name: impact
    label: Community Impact
    label_singular: Impact entry
    folder: src/content/impact
    create: true
    duplicate: true
    slug: "{{slug}}"
    preview_path: /impact/
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: titleBengali, label: Bengali title, widget: string, required: false }
      - name: date
        label: Start date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
      - name: endDate
        label: End date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
        required: false
      - {
          name: summary,
          label: Short introduction,
          widget: text,
          pattern: ["^.{1,200}$", "Keep this under 200 characters"],
        }
      - { name: partner, label: Partner organisation, widget: string, required: false }
      - { name: image, label: Main photo, widget: image, required: false }
      - { name: imageAlt, label: Describe the photo, widget: string, required: false }
      - name: gallery
        label: More photos
        widget: list
        required: false
        fields:
          - { name: image, label: Photo, widget: image }
          - { name: alt, label: Describe the photo, widget: string }
      - { name: draft, label: Hide from the website, widget: boolean, default: true }
      - { name: body, label: Details, widget: markdown, required: false }
